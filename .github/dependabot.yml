# =============================================================================
# Dependabot — grouped weekly dependency PRs, validated by the existing gates
# =============================================================================
# One PR per week per ecosystem, minor+patch grouped so a Monday merge is one
# green-CI review, not twelve. Majors arrive as their own PRs (they deserve
# individual attention on this stack — Astro/Sanity/wrangler majors have
# real migration notes). CI + the Playwright suite are the safety net that
# makes auto-updates sane on a solo project.
# (Dependabot over Renovate: no app install needed — config-only, so it
# ships from a session without account-owner clicks. Same idea, less setup.)
# =============================================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    # The Sanity stack (sanity, @sanity/*, react, react-dom) is pinned to exact
    # versions on purpose: 15cc9d1 pinned it to the versions proven in WCP, and
    # bd66441/00d4f30 tried client 7.26.2 and reverted it. Dependabot bumping one
    # member of that set (e.g. @sanity/preview-url-secret 4.0.8 -> 4.1.5) fails
    # npm ci with an ERESOLVE against the pinned @sanity/client, and took the
    # whole minor-and-patch group down with it on 2026-09-04. That stack moves
    # by hand, together, when WCP has proven the next set.
    ignore:
      - dependency-name: "sanity"
      - dependency-name: "@sanity/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # The sanity-plugin-* set is pinned for the same reason: 2026-09-04 the
      # regenerated group bumped asset-source-unsplash and documents-pane, which
      # import @sanity/ui/tooltip that the pinned @sanity/ui 3.3.5 does not export.
      - dependency-name: "sanity-plugin-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    groups:
      actions:
        update-types: ["major", "minor", "patch"]
