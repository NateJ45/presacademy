# WHEN IT RUNS (PORTS.md card 70 in ncs-astro-sanity-starter)
# Lighthouse was the slowest gate by a distance (3 passes over 15 URLs, ~650s)
# and it ran on every PR, including ones that cannot move a score. It is NOT a
# required status check (only `build` and `test` are), so it is free to be
# scheduled rather than blocking:
#
#   - pull_request, path-filtered to what can move a score (markup, styles,
#     assets, scripts, config), and audited on a SAMPLE of URLs, one per
#     distinct template, via --collect.url flags below. The full 15-URL list in
#     lighthouserc.json is untouched.
#   - push to main, same path filter, FULL url list: the post-merge record.
#   - weekly schedule, FULL url list: catches drift nobody pushed (a font host
#     change, a dependency bump that landed on a different path).
#   - workflow_dispatch: a branch tip on demand, full list.
#
# A docs-only or workflow-only PR therefore runs no Lighthouse and reports no
# check, which the dependabot auto-merge workflow treats as green.
name: Lighthouse

on:
  push:
    branches: [main]
    paths: &score-paths
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'lighthouserc.json'
      - 'astro.config.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    paths: *score-paths
  schedule:
    - cron: '17 5 * * 1'
  # Dispatchable so a branch tip can be re-audited on demand, without pushing
  # an empty commit.
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both (private-repo Actions minutes are metered).
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PUBLIC_SANITY_PROJECT_ID is intentionally left unset (the placeholder
      # path). sanityFetch() detects this and returns empty-state fallbacks for
      # every query, so the build completes with no Sanity project configured
      # and no credentials are required. Every fixed route still renders.
      - name: Build
        env:
          PUBLIC_SANITY_PROJECT_ID: ''
        run: npm run build

      # Reads ./lighthouserc.json. Accessibility is a hard gate (minScore 1),
      # LCP and CLS assert as errors; performance / best-practices / SEO are
      # warnings.
      #
      # On a PR the URL list is overridden with ONE PAGE PER TEMPLATE. Passing
      # --collect.url replaces the config's list, so the assertions and the
      # median-of-3 stay exactly as defined; only the page set shrinks. The
      # sample: home (HomeHero), about (the generic SingletonPage that
      # pricing/get-started/for-you/resources share), courses and faculty
      # (pinned catalog/roster components), events (events listing), faq
      # (Hero + accordion), style-guide (its own component showcase) and the
      # bespoke 404. Keep it in step with lighthouserc.json when a new template
      # ships. The URL shape matches lighthouserc.json (staticDistDir).
      - name: Lighthouse CI (sample, pull request)
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          npx lhci autorun
          --collect.url=http://localhost/index.html
          --collect.url=http://localhost/about/index.html
          --collect.url=http://localhost/courses/index.html
          --collect.url=http://localhost/faculty/index.html
          --collect.url=http://localhost/events/index.html
          --collect.url=http://localhost/faq/index.html
          --collect.url=http://localhost/style-guide/index.html
          --collect.url=http://localhost/404.html

      - name: Lighthouse CI (full)
        if: ${{ github.event_name != 'pull_request' }}
        run: npx lhci autorun
