name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Generate Sanity types
        run: npm run typegen

      - name: Fail if committed Sanity types are stale
        # `npm run build` does NOT run typegen, so src/lib/sanity.types.ts is
        # committed by hand after every schema change. If regenerating it here
        # produces a diff, the commit was stale (exactly the bug that shipped on
        # 2026-06-14). Catch it here instead of in production.
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build Astro
        # PUBLIC_SANITY_PROJECT_ID is intentionally left unset (the placeholder
        # path). sanityFetch() detects this and returns empty-state fallbacks for
        # every query, so the build completes with no Sanity project configured
        # and no credentials are required.
        env:
          PUBLIC_SANITY_PROJECT_ID: ""
        run: npm run build

      # (No separate Studio build: the studio folded into the root package
      # 2026-08-26 and is bundled into /studio by the Astro build above.)
      - name: Run tests
        run: npm test

      - name: Upload built site for Lighthouse
        uses: actions/upload-artifact@v4
        with:
          name: dist-client
          path: dist/client
          retention-days: 1

  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # Both projects from playwright.config.ts: chromium (desktop) AND
      # webkit-iphone. Installing only chromium makes every webkit test die
      # with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Runs the smoke, axe a11y (light + dark), and reflow (320/768/1024/1440)
      # suites against a fresh production build (the config's webServer runs
      # `npm run build`). The empty PUBLIC_SANITY_PROJECT_ID triggers the
      # same no-credentials fallback path as the build job above: every fixed
      # route renders with fallback content, so no secrets are needed. The
      # dynamic-detail smoke test skips itself when the sitemap has no detail
      # pages, which is exactly this case.
      - name: Run Playwright suites (smoke · a11y · reflow)
        env:
          PUBLIC_SANITY_PROJECT_ID: ""
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    # A REAL gate since 2026-08-25 (accessibility asserts as an error in
    # lighthouserc.json): a score regression blocks the merge.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist-client
          path: dist/client

      - name: Lighthouse CI (a11y / SEO / best-practices budgets)
        # Reads ./lighthouserc.json. Serves the static build and asserts category
        # budgets on the key pages that exist in the empty-state fallback build.
        run: npx --yes @lhci/cli@0.14.x autorun
