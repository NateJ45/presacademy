# SHAPE (why this looks like this; PORTS.md card 70 in ncs-astro-sanity-starter)
# Before card 70 this was two serial jobs and the site was built THREE times
# per PR (the build job, Playwright's webServer, Lighthouse), so wall time was
# the sum of every gate. Now:
#
#   static --+                      (drift check, audit, typegen, types, check, lint, format, unit)
#   site ----+-> build (aggregator)  (build once, link check, upload dist/client)
#            +-> e2e x3 shards -> test (aggregator)  (reuse the uploaded build)
#
# `build` and `test` are REQUIRED status checks in this repo's ruleset, so those
# two names must keep existing and must fail when anything behind them fails.
# They are aggregators now; the work runs in `static`, `site` and `e2e`. Do not
# rename them, and do not put a path filter on this workflow: a required check
# that never reports blocks the merge forever.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both (private-repo Actions minutes are metered).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need a built site. Runs in parallel with `site`.
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PORTS.md card 36. Every file here marked "PORTABLE: canonical copy" is
      # diffed against ncs-astro-sanity-starter, the library of record. Both
      # repos are public, so the checkout needs no token. CRLF is normalized to
      # LF and one trailing newline ignored before comparing, so a Windows
      # working tree and a Linux runner agree; everything else is byte-exact,
      # marker line included. On DRIFT: either port the improvement up into the
      # starter with a PORTS.md card in the same commit, or pull the starter's
      # copy forward here. A file that is forked on purpose drops its marker and
      # says so in its header instead.
      #
      # Every build (push to main, and any PR) checks against the starter's main.
      # Promote the starter first, then the sites.
      - name: Check out the library of record
        uses: actions/checkout@v7
        with:
          repository: NateJ45/ncs-astro-sanity-starter
          ref: main
          path: .ncs-starter

      # The checkout is deleted again as soon as the check passes. It has to
      # live INSIDE the workspace (actions/checkout refuses a path outside it),
      # and every whole-tree tool further down this job would otherwise sweep
      # it: `prettier --check .` tries to format the library using THIS repo's
      # node_modules and dies resolving the starter's own imports, and `eslint .`
      # does the same. Deleting it here beats adding .ncs-starter to a
      # .prettierignore, a .gitignore and an eslint config in six repos, because
      # that list has to be remembered again for the next whole-tree tool.
      - name: Canonical files have not drifted
        id: sync_check
        continue-on-error: true
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: node scripts/sync-check.mjs

      # Drift is a judgement, not a diff: an improvement made here either
      # belongs in the library or is site-specific. What was missing is that
      # porting it up was an errand you had to remember to start, in another
      # repo, after the build that blocked you. This opens the PR instead. It
      # never merges, and it never turns a clear "drift" failure into a
      # confusing "could not authenticate" one: it exits 0 whatever happens.
      - name: Propose the drift to the library of record
        if: steps.sync_check.outcome == 'failure'
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: node scripts/propose-drift.mjs

      # The checkout has to go before any whole-tree tool further down this
      # job sweeps it, and the gate has to fail for real once it has.
      - name: Enforce the drift check
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: |
          rm -rf "$NCS_STARTER_DIR"
          [ "${{ steps.sync_check.outcome }}" = "success" ] || exit 1

      # What can a stranger read out of this site's dataset? Sanity's free plan
      # is "2 datasets (public only)", so a public dataset is world readable over
      # a plain URL with no token, and the project id ships in the page source.
      # A login in front of a page does not protect the API behind it: on
      # wcp-website that meant 37 family directory entries - children's names and
      # home addresses - readable by anyone, behind a correctly built gate.
      #
      # Runs anonymously on purpose and needs no secrets, so it works on forks
      # and PRs. Exceptions live in public-data-policy.json, each with a reason.
      - name: No personal data is publicly readable
        # The project id is PUBLIC (it ships in every image URL in the page
        # source) but it still has to be handed to this step: there is no .env
        # on a runner, and the audit refuses to skip when it cannot find one -
        # it would rather fail than report a pass it did not earn.
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
        run: node scripts/public-data-audit.mjs

      # `sanity schema extract` bundles the whole Studio config and its import
      # graph. NODE_OPTIONS raises the heap for this step only, and the loop
      # retries up to three times: on the hosted runners the extract
      # intermittently dies with "Aborted (core dumped)" (exit 134) and passes
      # on a plain re-run. Runner flake, not a schema problem.
      - name: Generate Sanity types
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for attempt in 1 2 3; do
            if npm run typegen; then exit 0; fi
            echo "::warning::typegen attempt $attempt failed (runner flake?) - retrying"
            sleep 15
          done
          echo "::error::typegen failed three times"
          exit 1

      - name: Fail if committed Sanity types are stale
        # `npm run build` does NOT run typegen, so src/lib/sanity.types.ts is
        # committed by hand after every schema change. If regenerating it here
        # produces a diff, the commit was stale (exactly the bug that shipped on
        # 2026-06-14). Catch it here instead of in production.
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      - name: Type check (astro check)
        run: npx astro check

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Pure-function unit tests (node --test, type-stripped): src/lib/*.test.ts.
      # Hermetic: no browser, no Sanity token.
      - name: Unit tests (node --test)
        run: npm run test:unit

  # Builds the site ONCE. Everything downstream reuses what this uploads.
  site:
    name: Build and links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        # PUBLIC_SANITY_PROJECT_ID is intentionally left unset (the placeholder
        # path). sanityFetch() detects this and returns empty-state fallbacks for
        # every query, so the build completes with no Sanity project configured
        # and no credentials are required. (The Studio folded into the root
        # package 2026-08-26 and is bundled into /studio by this same build.)
        env:
          PUBLIC_SANITY_PROJECT_ID: ''
        run: npm run build

      # Every internal link in the static build resolves. /studio, /preview and
      # /api are skipped: Studio plumbing, SSR-only or client-rendered, so a
      # crawler sees nothing real there.
      - name: Check internal links
        run: npm run check:links

      # Only dist/client: that is all the Playwright shards serve. dist/server
      # (the SSR bundle) is never exercised by the static suite.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-client
          path: dist/client
          retention-days: 1
          if-no-files-found: error

  # REQUIRED CHECK. Green only when both halves are green.
  build:
    name: build
    if: ${{ always() }}
    needs: [static, site]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "static=${{ needs.static.result }} site=${{ needs.site.result }}"
          [ "${{ needs.static.result }}" = "success" ] && [ "${{ needs.site.result }}" = "success" ]

  # The Playwright suite, sharded. fullyParallel is on in playwright.config.ts,
  # so --shard splits at TEST granularity, but into EQUAL-COUNT blocks (see the
  # PWTEST_SHARD_WEIGHTS note on the test step: the tests are not equal cost).
  e2e:
    name: e2e (shard ${{ matrix.shard }}/3)
    needs: [site]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          name: dist-client
          path: dist/client

      # The browser download is the slow part, the apt libraries are not. Cache
      # the browsers by Playwright version; on a hit install only the system
      # libraries. Both projects from playwright.config.ts need a browser:
      # chromium (desktop) AND webkit-iphone. Installing only chromium makes
      # every webkit test die with "Executable doesn't exist".
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` runs `apt-get update`, which fails outright when the
      # runner's third-party Chrome/Microsoft apt sources are mid-sync and
      # report a "Hash Sum mismatch" (that killed a WCP deploy 2026-09-09).
      # Playwright's system libraries come from Ubuntu's own archive, so drop
      # those sources first, then retry once for transient network failures.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft*
          npx playwright install --with-deps chromium webkit ||
            npx playwright install --with-deps chromium webkit

      - name: Install Playwright system libraries (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft*
          npx playwright install-deps chromium webkit ||
            npx playwright install-deps chromium webkit

      # Runs the smoke, axe a11y (light + dark), and reflow (320/768/1024/1440)
      # suites. PLAYWRIGHT_SKIP_BUILD makes the config serve the downloaded
      # dist/client instead of running `npm run build` a second time. The
      # empty PUBLIC_SANITY_PROJECT_ID is kept for parity with the build job
      # (the tests only read the build, but a stray rebuild must take the same
      # no-credentials fallback path). The dynamic-detail smoke test skips
      # itself when the sitemap has no detail pages, which is exactly this case.
      - name: Run tests (smoke, a11y, a11y-dark, reflow)
        env:
          PUBLIC_SANITY_PROJECT_ID: ''
          PLAYWRIGHT_SKIP_BUILD: '1'
          # Playwright's default --shard hands each shard a CONTIGUOUS block of
          # an EQUAL NUMBER of tests (47 / 46 / 46 of 139), in project order
          # (all chromium, then all webkit-iphone). The tests are not equal:
          # the middle 46 (all chromium, mostly reflow and smoke) cost 7-11s of
          # test step, the other two shards 42-50s (runs 37157011093 and
          # 37158003175). PWTEST_SHARD_WEIGHTS (colon separated, one weight per
          # shard, an INTERNAL Playwright variable) resizes the three blocks
          # instead: 37 + 67 + 35 = 139 tests, about 62s / 71s / 70s of summed
          # per-test time on the local reference run, with shard 1's visual
          # step counted. Every test still runs exactly once (the blocks always
          # partition the whole list); a stale weight only unbalances the
          # shards, it cannot drop a test. RE-CUT when tests are added in bulk:
          # docs/agent/ci-cd-and-ops.md, "Re-cutting the shard weights".
          PWTEST_SHARD_WEIGHTS: '37:67:35'
        run: npm test -- --shard=${{ matrix.shard }}/3 --reporter=github,html

      # Pixel-diffs /style-guide (light + dark) against the committed Linux
      # baselines. It is one small spec, not sharded, so it rides on shard 1
      # and serves the same downloaded build (playwright.visual.config.ts honours
      # PLAYWRIGHT_SKIP_BUILD too). A red diff means the design system moved:
      # look at the visual-diffs artifact; if the change is INTENDED, dispatch
      # update-visual-baselines.yml.
      - name: Visual regression (style guide)
        if: ${{ matrix.shard == 1 }}
        env:
          PUBLIC_SANITY_PROJECT_ID: ''
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npm run test:visual

      # Only on failure: a green run has nothing worth the upload time.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure() && matrix.shard == 1
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # REQUIRED CHECK. Green only when every shard is green.
  test:
    name: test
    if: ${{ always() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "e2e=${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ]
