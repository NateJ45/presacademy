name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both (private-repo Actions minutes are metered).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `sanity schema extract` bundles the whole Studio config and its import
      # graph. NODE_OPTIONS raises the heap for this step only, and the loop
      # retries up to three times: on the hosted runners the extract
      # intermittently dies with "Aborted (core dumped)" (exit 134) and passes
      # on a plain re-run. Runner flake, not a schema problem.
      - name: Generate Sanity types
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for attempt in 1 2 3; do
            if npm run typegen; then exit 0; fi
            echo "::warning::typegen attempt $attempt failed (runner flake?) - retrying"
            sleep 15
          done
          echo "::error::typegen failed three times"
          exit 1

      - name: Fail if committed Sanity types are stale
        # `npm run build` does NOT run typegen, so src/lib/sanity.types.ts is
        # committed by hand after every schema change. If regenerating it here
        # produces a diff, the commit was stale (exactly the bug that shipped on
        # 2026-06-14). Catch it here instead of in production.
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      - name: Type check (astro check)
        run: npx astro check

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Pure-function unit tests (node --test, type-stripped): src/lib/*.test.ts.
      # Hermetic: no browser, no Sanity token.
      - name: Unit tests (node --test)
        run: npm run test:unit

      - name: Build
        # PUBLIC_SANITY_PROJECT_ID is intentionally left unset (the placeholder
        # path). sanityFetch() detects this and returns empty-state fallbacks for
        # every query, so the build completes with no Sanity project configured
        # and no credentials are required. (The Studio folded into the root
        # package 2026-08-26 and is bundled into /studio by this same build.)
        env:
          PUBLIC_SANITY_PROJECT_ID: ''
        run: npm run build

      # Every internal link in the static build resolves. /studio, /preview and
      # /api are skipped: Studio plumbing, SSR-only or client-rendered, so a
      # crawler sees nothing real there.
      - name: Check internal links
        run: npm run check:links

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both projects from playwright.config.ts: chromium (desktop) AND
      # webkit-iphone. Installing only chromium makes every webkit test die
      # with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Runs the smoke, axe a11y (light + dark), and reflow (320/768/1024/1440)
      # suites against a fresh production build (the config's webServer runs
      # `npm run build`). The empty PUBLIC_SANITY_PROJECT_ID triggers the
      # same no-credentials fallback path as the build job above: every fixed
      # route renders with fallback content, so no secrets are needed. The
      # dynamic-detail smoke test skips itself when the sitemap has no detail
      # pages, which is exactly this case.
      - name: Run tests (smoke, a11y, a11y-dark, reflow)
        env:
          PUBLIC_SANITY_PROJECT_ID: ''
        run: npm test

      # Pixel-diffs /style-guide (light + dark) against the committed Linux
      # baselines. Reuses nothing from the step above (reuseExistingServer is
      # CI-disabled, so this rebuilds). A red diff means the design system
      # moved: look at the visual-diffs artifact; if the change is INTENDED,
      # dispatch update-visual-baselines.yml.
      - name: Visual regression (style guide)
        env:
          PUBLIC_SANITY_PROJECT_ID: ''
        run: npm run test:visual

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
